name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı dal için eski çalışmaları iptal et
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hızlı kontrol: web dosyaları sağlam mı?
  web:
    name: Web doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS söz dizimi kontrolü
        run: node --check www/game.js
      - name: JSON doğrulama
        run: |
          for f in package.json capacitor.config.json www/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "$f OK"
          done

  # Android debug APK derle ve artifact olarak yükle
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      # not: npm cache, package-lock.json gerektirir; lock dosyası
      # tutmadığımız için cache'i kapalı bırakıyoruz.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Android platformunu ekle
        run: npx cap add android

      - name: Simge ve açılış ekranını üret
        run: npx capacitor-assets generate --assetPath resources --android

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      - name: Debug APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: idle-human-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
