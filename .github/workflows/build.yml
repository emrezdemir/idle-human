name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı dal için eski çalışmaları iptal et
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Release oluşturma ve Pages yayını için gerekli izinler
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Hızlı kontrol: web dosyaları sağlam mı?
  web:
    name: Web doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: JS söz dizimi kontrolü
        run: node --check www/game.js
      - name: JSON doğrulama
        run: |
          for f in package.json capacitor.config.json www/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "$f OK"
          done

  # Android'i derle: secret varsa imzalı AAB + APK, yoksa (PR) debug APK
  android:
    name: Android derleme
    runs-on: ubuntu-latest
    needs: web
    env:
      # Job genelinde erişilebilir olsun ki adım 'if' koşullarında kullanılabilsin
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle (kilit dosyasından)
        run: npm ci

      - name: Sürümü damgala (build + tarih)
        run: |
          export SHA=$(git rev-parse --short HEAD)
          export DATE=$(date -u +%Y-%m-%d)
          node -e 'const fs=require("fs"),f="www/version.js";let s=fs.readFileSync(f,"utf8");s=s.replace(/build: "dev"/,`build: "${process.env.SHA}"`).replace(/date: ""/,`date: "${process.env.DATE}"`);fs.writeFileSync(f,s);console.log("Sürüm damgalandı:",process.env.SHA,process.env.DATE)'

      - name: Web varlıklarını senkronla
        run: npx cap sync android

      # --- İmzalama: yalnızca keystore secret'ı tanımlıysa ---
      - name: Keystore'u secret'tan çöz
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: İmzalı AAB + APK derle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd android && chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../idle-human.aab
          cp app/build/outputs/apk/release/app-release.apk ../idle-human.apk

      # --- İmzasız geri dönüş: secret yoksa (örn. fork PR) sadece debug APK ---
      - name: Debug APK derle (imza yoksa)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../idle-human.apk

      - name: Sırları temizle
        if: always()
        run: rm -f android/release.keystore android/keystore.properties

      - name: Derlenen dosyaları artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: idle-human-build
          path: |
            idle-human.aab
            idle-human.apk
          if-no-files-found: error

      # main'e push'ta kalıcı public indirme linki için Release'e koy.
      # İndirme: .../releases/latest/download/idle-human.apk (yan yükleme)
      #          .../releases/latest/download/idle-human.aab (Play Console yüklemesi)
      #
      # İmza VARSA: imzalı APK + AAB yayınlanır (Play'e yüklenebilir).
      - name: Release'i güncelle (imzalı)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: En son sürüm
          body: |
            `main` dalından otomatik derlenen, imzalı en son sürüm.

            - `idle-human.apk` — telefona doğrudan kurmak (yan yükleme) için
            - `idle-human.aab` — Google Play Console'a yüklemek için
          files: |
            idle-human.apk
            idle-human.aab

      # İmza YOKSA: imzasız test APK'sı yayınlanır ki indirme linki güncel kalsın.
      # Bu sürüm Play'e yüklenemez; sadece yan yükleme/test içindir.
      # Keystore secret'ları eklenince otomatik olarak imzalı sürüme yükselir.
      - name: Release'i güncelle (imzasız test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.ANDROID_KEYSTORE_BASE64 == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: En son sürüm (imzasız test)
          body: |
            `main` dalından otomatik derlenen **imzasız test sürümü**.

            - `idle-human.apk` — telefona yan yükleyip denemek için
              (Android "bilinmeyen kaynak" iznine ihtiyaç duyar).

            > Bu APK imzasızdır ve Google Play'e yüklenemez. Yayın için
            > keystore secret'ları ekleyin; pipeline otomatik olarak imzalı
            > APK + AAB üretmeye geçer (bkz. STORE.md).
          files: |
            idle-human.apk

  # Oynanabilir oyun + indirme sayfasını GitHub Pages'e yayınla
  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sürümü damgala (build + tarih)
        run: |
          export SHA=$(git rev-parse --short HEAD)
          export DATE=$(date -u +%Y-%m-%d)
          node -e 'const fs=require("fs"),f="www/version.js";let s=fs.readFileSync(f,"utf8");s=s.replace(/build: "dev"/,`build: "${process.env.SHA}"`).replace(/date: ""/,`date: "${process.env.DATE}"`);fs.writeFileSync(f,s);console.log("Sürüm damgalandı:",process.env.SHA,process.env.DATE)'

      - name: Site klasörünü hazırla
        run: |
          mkdir -p site
          cp -r pages/* site/          # landing + gizlilik sayfası
          cp -r www site/game          # oynanabilir oyun -> /game/

      - uses: actions/configure-pages@v5

      - name: Pages artifact'ini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pages'e dağıt
        id: deploy
        uses: actions/deploy-pages@v4
